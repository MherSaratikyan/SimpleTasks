name: simpletasks

# By default the services use the SQL Server you already run on this computer, reached
# through host.docker.internal. To run a separate SQL Server inside Compose instead, set
# SQL_SERVER=db in .env and start with: docker compose --profile own-db up -d
# If the services report "Network is unreachable" for an IPv6 address, set SQL_SERVER in .env
# to Docker Desktop's IPv4 address for this computer: SQL_SERVER=192.168.65.254,1433
x-sql: &sql "Server=${SQL_SERVER:-host.docker.internal,1433};Database=${SQL_DATABASE:-SimpleTasks};User Id=sa;Password=${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set it};Encrypt=True;TrustServerCertificate=True"
x-rabbit: &rabbit "amqp://simpletasks:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}@rabbitmq:5672"
x-public-url: &public-url "${PUBLIC_URL:-http://localhost:5080}"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["own-db"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Copy .env.example to .env and set a strong password}"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    # RabbitMQ keeps its data under the hostname, so it has to stay the same.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: simpletasks
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/mnesia
    healthcheck:
      # A plain port check: rabbitmq-diagnostics runs as root and can claim the Erlang cookie during boot.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 10s
      retries: 12

  identity:
    build:
      context: .
      dockerfile: services/SimpleTasks.Identity/Dockerfile
    image: saratikyan/simpletasks-identity:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: *sql
      ConnectionStrings__messaging: *rabbit
      Internal__ApiKey: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}"
      Identity__FirstAdminEmail: "${FIRST_ADMIN_EMAIL:?Set FIRST_ADMIN_EMAIL in .env}"
      App__BaseUrl: *public-url
    depends_on:
      db:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy

  work:
    build:
      context: .
      dockerfile: services/SimpleTasks.Work/Dockerfile
    image: saratikyan/simpletasks-work:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: *sql
      ConnectionStrings__messaging: *rabbit
      services__identity__http__0: "http://identity:8080"
    depends_on:
      db:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started

  notifications:
    build:
      context: .
      dockerfile: services/SimpleTasks.Notifications/Dockerfile
    image: saratikyan/simpletasks-notifications:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: *sql
      ConnectionStrings__messaging: *rabbit
      services__identity__http__0: "http://identity:8080"
      Gmail__Address: "${GMAIL_ADDRESS:-}"
      Gmail__AppPassword: "${GMAIL_APP_PASSWORD:-}"
      App__BaseUrl: *public-url
    depends_on:
      db:
        condition: service_healthy
        required: false
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: SimpleTasks/Dockerfile
    image: saratikyan/simpletasks-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      # All interfaces, so people on your network can reach it. Use "127.0.0.1:5080:8080" for this computer only.
      - "5080:8080"
    volumes:
      # Sign-in cookie keys survive restarts, so nobody is logged out when the container restarts.
      - web-keys:/home/app/.aspnet/DataProtection-Keys
    environment:
      # Behind Tailscale Funnel or another proxy: use the visitor's address and https scheme it forwards.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Minutes without activity before someone has to log in again.
      Auth__SessionMinutes: "${SESSION_MINUTES:-30}"
      Internal__ApiKey: "${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}"
      services__identity__http__0: "http://identity:8080"
      services__work__http__0: "http://work:8080"
      services__notifications__http__0: "http://notifications:8080"
    depends_on:
      - identity
      - work
      - notifications

volumes:
  sqlserver-data:
  rabbitmq-data:
  web-keys:
